[project]
name = "hawthorne"
version = "0.0.1"
description = "Eval-Hawthorne-Effect: does stated or experienced monitoring probability change LLM cheating? Built on ImpossibleBench."
requires-python = ">=3.12,<3.13"
dependencies = [
    "impossiblebench",
    "inspect-ai",
    "python-dotenv>=1.0",
    "anthropic>=0.40",
    "openai>=1.50",
]

[tool.uv.sources]
# Pinned, unmodified upstream code lives in the git submodule external/impossiblebench.
impossiblebench = { path = "external/impossiblebench", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hawthorne"]
